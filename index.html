<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="TheWatch 23 - Minimalist 4-LED Segmental Chronometer with interactive metallic scroll wheels, live Zeller weekday, and acoustic mechanical feedback" />
    <title>TheWatch 23</title>
    <!-- Webpage Icon (Favicon with transparent background) -->
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
</head>

<body>
    <div class="watch-chassis">
        <!-- Mechanical Bezel Corner Torx Bolts -->
        <span class="chassis-bolt bolt-tl" aria-hidden="true"></span>
        <span class="chassis-bolt bolt-tr" aria-hidden="true"></span>
        <span class="chassis-bolt bolt-bl" aria-hidden="true"></span>
        <span class="chassis-bolt bolt-br" aria-hidden="true"></span>

        <!-- Top Control Bar (Webpage Icon on Left, Sound & Theme Controls on Right) -->
        <header class="watch-top-bar">
            <!-- Top-Left Webpage Icon Button: resets all to current date and time on click -->
            <button type="button" class="bar-btn icon-reset-btn" id="btn-reset" aria-label="Reset to current date and time" title="Reset to current date and time">
                <svg viewBox="0 0 100 100" class="brand-icon-svg" aria-hidden="true">
                    <rect x="6" y="6" width="88" height="88" rx="20" class="icon-bezel" />
                    <!-- 4-LED signature motif with transparent background -->
                    <polygon points="18,18 82,18 50,50" class="icon-seg icon-seg-top" />
                    <polygon points="82,18 82,82 50,50" class="icon-seg icon-seg-right" />
                    <polygon points="82,82 18,82 50,50" class="icon-seg icon-seg-bottom" />
                    <polygon points="18,82 18,18 50,50" class="icon-seg icon-seg-left" />
                    <circle cx="50" cy="50" r="4.5" class="icon-core" />
                </svg>
                <span class="live-pulse-dot" id="live-indicator"></span>
            </button>

            <!-- Top-Right Control Group: Acoustic Sound Toggle + Theme Mode Cycler -->
            <div class="top-controls-right">
                <!-- Acoustic Sound Effect Toggle Button -->
                <button type="button" class="bar-btn sound-mode-btn" id="btn-sound" aria-label="Toggle mechanical sound effects" title="Sound Effects: ON">
                    <span class="sound-icon-container" id="sound-icon-container">
                        <!-- Injected dynamically via script.js -->
                    </span>
                </button>

                <!-- Theme Mode Button: cycles system -> (opposite of system) -> next opposite -->
                <button type="button" class="bar-btn theme-mode-btn" id="btn-theme" aria-label="Cycle theme mode" title="Cycle theme mode">
                    <span class="theme-icon-container" id="theme-icon-container">
                        <!-- Injected dynamically via script.js -->
                    </span>
                </button>
            </div>
        </header>

        <!-- Main Display Panel -->
        <main class="display-panel">
            <!-- 4-LED Segmental Matrix: Hours UP, Minutes DOWN (No colon between LEDs) -->
            <div class="led-matrix-deck">
                <!-- Hours Row (H1 & H2) - UP -->
                <div class="led-row led-row-hours">
                    <div class="digit-card" data-digit-card="h1">
                        <div class="digit-glass-reflection" aria-hidden="true"></div>
                        <svg viewBox="0 0 100 100" class="svg-class digit-svg" id="h1-svg" role="group" aria-label="Hour tens LED matrix">
                            <polygon points="0,0 100,0 50,50" class="led" id="h1-led0" data-digit="h1" data-seg="0" title="Tap to toggle" />
                            <polygon points="100,0 100,100 50,50" class="led" id="h1-led1" data-digit="h1" data-seg="1" title="Tap to toggle" />
                            <polygon points="100,100 0,100 50,50" class="led" id="h1-led2" data-digit="h1" data-seg="2" title="Tap to toggle" />
                            <polygon points="0,100 0,0 50,50" class="led" id="h1-led3" data-digit="h1" data-seg="3" title="Tap to toggle" />
                        </svg>
                    </div>

                    <div class="digit-card" data-digit-card="h2">
                        <div class="digit-glass-reflection" aria-hidden="true"></div>
                        <svg viewBox="0 0 100 100" class="svg-class digit-svg" id="h2-svg" role="group" aria-label="Hour units LED matrix">
                            <polygon points="0,0 100,0 50,50" class="led" id="h2-led0" data-digit="h2" data-seg="0" title="Tap to toggle" />
                            <polygon points="100,0 100,100 50,50" class="led" id="h2-led1" data-digit="h2" data-seg="1" title="Tap to toggle" />
                            <polygon points="100,100 0,100 50,50" class="led" id="h2-led2" data-digit="h2" data-seg="2" title="Tap to toggle" />
                            <polygon points="0,100 0,0 50,50" class="led" id="h2-led3" data-digit="h2" data-seg="3" title="Tap to toggle" />
                        </svg>
                    </div>
                </div>

                <!-- Minutes Row (M1 & M2) - DOWN (Directly stacked without colon) -->
                <div class="led-row led-row-minutes">
                    <div class="digit-card" data-digit-card="m1">
                        <div class="digit-glass-reflection" aria-hidden="true"></div>
                        <svg viewBox="0 0 100 100" class="svg-class digit-svg" id="m1-svg" role="group" aria-label="Minute tens LED matrix">
                            <polygon points="0,0 100,0 50,50" class="led" id="m1-led0" data-digit="m1" data-seg="0" title="Tap to toggle" />
                            <polygon points="100,0 100,100 50,50" class="led" id="m1-led1" data-digit="m1" data-seg="1" title="Tap to toggle" />
                            <polygon points="100,100 0,100 50,50" class="led" id="m1-led2" data-digit="m1" data-seg="2" title="Tap to toggle" />
                            <polygon points="0,100 0,0 50,50" class="led" id="m1-led3" data-digit="m1" data-seg="3" title="Tap to toggle" />
                        </svg>
                    </div>

                    <div class="digit-card" data-digit-card="m2">
                        <div class="digit-glass-reflection" aria-hidden="true"></div>
                        <svg viewBox="0 0 100 100" class="svg-class digit-svg" id="m2-svg" role="group" aria-label="Minute units LED matrix">
                            <polygon points="0,0 100,0 50,50" class="led" id="m2-led0" data-digit="m2" data-seg="0" title="Tap to toggle" />
                            <polygon points="100,0 100,100 50,50" class="led" id="m2-led1" data-digit="m2" data-seg="1" title="Tap to toggle" />
                            <polygon points="100,100 0,100 50,50" class="led" id="m2-led2" data-digit="m2" data-seg="2" title="Tap to toggle" />
                            <polygon points="0,100 0,0 50,50" class="led" id="m2-led3" data-digit="m2" data-seg="3" title="Tap to toggle" />
                        </svg>
                    </div>
                </div>

                <!-- Ground Reflection Tray for all lighting conditions -->
                <div class="led-reflection-tray" aria-hidden="true"></div>
            </div>

            <!-- Metallic Scroll Wheel Deck for Time and Date -->
            <div class="scroll-wheels-deck">
                <!-- Time Scroll Wheels: [Hours] : [Minutes] (Seconds removed) -->
                <div class="wheels-row time-deck">
                    <!-- Hours Wheel (00-23) -->
                    <div class="wheel-slot hour-slot" data-wheel="hour" tabindex="0" role="slider" aria-label="Hour selector">
                        <div class="wheel-knurl-track track-left" aria-hidden="true"></div>
                        <div class="wheel-lens"></div>
                        <div class="wheel-cylinder" id="cylinder-hour"></div>
                        <div class="wheel-knurl-track track-right" aria-hidden="true"></div>
                    </div>

                    <div class="wheel-delimiter">:</div>

                    <!-- Minutes Wheel (00-59) -->
                    <div class="wheel-slot minute-slot" data-wheel="minute" tabindex="0" role="slider" aria-label="Minute selector">
                        <div class="wheel-knurl-track track-left" aria-hidden="true"></div>
                        <div class="wheel-lens"></div>
                        <div class="wheel-cylinder" id="cylinder-minute"></div>
                        <div class="wheel-knurl-track track-right" aria-hidden="true"></div>
                    </div>
                </div>

                <!-- Date Complications Row: [AD/BC] [Year] [Month in text] [Date] then [Display Week] -->
                <div class="wheels-row date-deck">
                    <!-- 1. Era Wheel (AD / BC - Bounded, No Infinite Scroll) -->
                    <div class="wheel-slot era-slot" data-wheel="era" tabindex="0" role="slider" aria-label="Era selector (AD or BC)">
                        <div class="wheel-knurl-track track-left" aria-hidden="true"></div>
                        <div class="wheel-lens"></div>
                        <div class="wheel-cylinder" id="cylinder-era"></div>
                        <div class="wheel-knurl-track track-right" aria-hidden="true"></div>
                    </div>

                    <div class="wheel-separator" aria-hidden="true"></div>

                    <!-- 2. Year Wheel (0001-9999) -->
                    <div class="wheel-slot year-slot" data-wheel="year" tabindex="0" role="slider" aria-label="Year selector">
                        <div class="wheel-knurl-track track-left" aria-hidden="true"></div>
                        <div class="wheel-lens"></div>
                        <div class="wheel-cylinder" id="cylinder-year"></div>
                        <div class="wheel-knurl-track track-right" aria-hidden="true"></div>
                    </div>

                    <div class="wheel-separator" aria-hidden="true"></div>

                    <!-- 3. Month in Text Wheel (JAN - DEC) -->
                    <div class="wheel-slot month-slot" data-wheel="month" tabindex="0" role="slider" aria-label="Month selector">
                        <div class="wheel-knurl-track track-left" aria-hidden="true"></div>
                        <div class="wheel-lens"></div>
                        <div class="wheel-cylinder" id="cylinder-month"></div>
                        <div class="wheel-knurl-track track-right" aria-hidden="true"></div>
                    </div>

                    <div class="wheel-separator" aria-hidden="true"></div>

                    <!-- 4. Date Wheel (01-31) -->
                    <div class="wheel-slot day-slot" data-wheel="day" tabindex="0" role="slider" aria-label="Day of month selector">
                        <div class="wheel-knurl-track track-left" aria-hidden="true"></div>
                        <div class="wheel-lens"></div>
                        <div class="wheel-cylinder" id="cylinder-day"></div>
                        <div class="wheel-knurl-track track-right" aria-hidden="true"></div>
                    </div>

                    <div class="wheel-separator" aria-hidden="true"></div>

                    <!-- 5. Weekday Display Complication (Live calculated via Zeller's Congruence, Non-scroller) -->
                    <div class="weekday-display-pod" id="weekday-display" aria-label="Day of week" title="Weekday (Live calculated via Zeller's Congruence)">
                        <span class="weekday-bezel-rim" aria-hidden="true"></span>
                        <span class="weekday-value" id="weekday-value">---</span>
                    </div>
                </div>
            </div>
        </main>
    </div>
</body>

</html>
