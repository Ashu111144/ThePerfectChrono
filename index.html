<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description"
        content="ThePerfectChrono - Minimalist 4-LED Segmental Chronometer" />
    <title>The Perfect Chrono</title>
    <!-- Webpage Icon -->
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
</head>

<body>
    <div class="watch-chassis">
        <!-- Top Control Bar -->
        <header class="watch-top-bar">
            <!-- Reset Button & Live Sync Status Indicator -->
            <div class="top-brand-group">
                <button type="button" class="bar-btn icon-reset-btn" id="btn-reset"
                    aria-label="Reset to current date and time" title="Reset to current date and time">
                    <img src="favicon.svg" alt="The Perfect Chrono Logo" class="brand-icon-svg">
                </button>
                <span class="live-pulse-dot" id="live-indicator" role="status"
                    aria-label="Live sync status" title="Live clock sync active"></span>
            </div>

            <!-- Title -->
            <div class="top-title-container">
                <h1 class="watch-title">The Perfect Chrono</h1>
            </div>

            <!-- Sound & Theme Controls -->
            <div class="top-controls-right">
                <button type="button" class="bar-btn sound-mode-btn" id="btn-sound"
                    aria-label="Toggle mechanical sound effects" title="Sound Effects: ON">
                    <span class="sound-icon-container" id="sound-icon-container"></span>
                </button>

                <button type="button" class="bar-btn theme-mode-btn" id="btn-theme"
                    aria-label="Cycle theme mode" title="Cycle theme mode">
                    <span class="theme-icon-container" id="theme-icon-container"></span>
                </button>
            </div>
        </header>

        <!-- Main Display Panel -->
        <main class="display-panel">
            <!-- Upper Time Section: Left = 4-LED Watch Face, Right = Hour & Min Scroll Wheels -->
            <section class="time-section" aria-label="Time display and controls">
                <!-- 4-LED Segmental Matrix (Hours UP, Minutes DOWN) -->
                <div class="led-matrix-deck">
                    <!-- Hours Row (H1 & H2) -->
                    <div class="led-row led-row-hours">
                        <div class="digit-card" data-digit-card="h1">
                            <svg viewBox="0 0 100 100" class="digit-svg" id="h1-svg" role="group"
                                aria-label="Hour tens LED matrix">
                                <polygon points="10,6 90,6 50,46" class="led" id="h1-led0" data-digit="h1" data-seg="0"
                                    title="Tap to toggle" />
                                <polygon points="94,10 94,90 54,50" class="led" id="h1-led1" data-digit="h1" data-seg="1"
                                    title="Tap to toggle" />
                                <polygon points="90,94 10,94 50,54" class="led" id="h1-led2" data-digit="h1" data-seg="2"
                                    title="Tap to toggle" />
                                <polygon points="6,90 6,10 46,50" class="led" id="h1-led3" data-digit="h1" data-seg="3"
                                    title="Tap to toggle" />
                                <circle cx="50" cy="50" r="2.8" class="led-center-jewel" aria-hidden="true" />
                            </svg>
                        </div>

                        <div class="digit-card" data-digit-card="h2">
                            <svg viewBox="0 0 100 100" class="digit-svg" id="h2-svg" role="group"
                                aria-label="Hour units LED matrix">
                                <polygon points="10,6 90,6 50,46" class="led" id="h2-led0" data-digit="h2" data-seg="0"
                                    title="Tap to toggle" />
                                <polygon points="94,10 94,90 54,50" class="led" id="h2-led1" data-digit="h2" data-seg="1"
                                    title="Tap to toggle" />
                                <polygon points="90,94 10,94 50,54" class="led" id="h2-led2" data-digit="h2" data-seg="2"
                                    title="Tap to toggle" />
                                <polygon points="6,90 6,10 46,50" class="led" id="h2-led3" data-digit="h2" data-seg="3"
                                    title="Tap to toggle" />
                                <circle cx="50" cy="50" r="2.8" class="led-center-jewel" aria-hidden="true" />
                            </svg>
                        </div>
                    </div>

                    <!-- Minutes Row (M1 & M2) -->
                    <div class="led-row led-row-minutes">
                        <div class="digit-card" data-digit-card="m1">
                            <svg viewBox="0 0 100 100" class="digit-svg" id="m1-svg" role="group"
                                aria-label="Minute tens LED matrix">
                                <polygon points="10,6 90,6 50,46" class="led" id="m1-led0" data-digit="m1" data-seg="0"
                                    title="Tap to toggle" />
                                <polygon points="94,10 94,90 54,50" class="led" id="m1-led1" data-digit="m1" data-seg="1"
                                    title="Tap to toggle" />
                                <polygon points="90,94 10,94 50,54" class="led" id="m1-led2" data-digit="m1" data-seg="2"
                                    title="Tap to toggle" />
                                <polygon points="6,90 6,10 46,50" class="led" id="m1-led3" data-digit="m1" data-seg="3"
                                    title="Tap to toggle" />
                                <circle cx="50" cy="50" r="2.8" class="led-center-jewel" aria-hidden="true" />
                            </svg>
                        </div>

                        <div class="digit-card" data-digit-card="m2">
                            <svg viewBox="0 0 100 100" class="digit-svg" id="m2-svg" role="group"
                                aria-label="Minute units LED matrix">
                                <polygon points="10,6 90,6 50,46" class="led" id="m2-led0" data-digit="m2" data-seg="0"
                                    title="Tap to toggle" />
                                <polygon points="94,10 94,90 54,50" class="led" id="m2-led1" data-digit="m2" data-seg="1"
                                    title="Tap to toggle" />
                                <polygon points="90,94 10,94 50,54" class="led" id="m2-led2" data-digit="m2" data-seg="2"
                                    title="Tap to toggle" />
                                <polygon points="6,90 6,10 46,50" class="led" id="m2-led3" data-digit="m2" data-seg="3"
                                    title="Tap to toggle" />
                                <circle cx="50" cy="50" r="2.8" class="led-center-jewel" aria-hidden="true" />
                            </svg>
                        </div>
                    </div>
                </div>

                <!-- Right: Hour & Min Scroll Wheels -->
                <div class="time-wheels-stacked" role="group" aria-label="Time scroll wheels">
                    <!-- Hour Wheels Row -->
                    <div class="time-stack-row hour-stack-row">
                        <div class="stack-wheels-pair">
                            <div class="wheel-slot digit-slot" id="slot-h1" data-wheel="h1" tabindex="0" role="slider"
                                aria-label="Hour tens selector">
                                <div class="wheel-cylinder" id="cylinder-h1"></div>
                            </div>
                            <div class="wheel-slot digit-slot" id="slot-h2" data-wheel="h2" tabindex="0" role="slider"
                                aria-label="Hour units selector">
                                <div class="wheel-cylinder" id="cylinder-h2"></div>
                            </div>
                        </div>
                    </div>

                    <!-- Minute Wheels Row -->
                    <div class="time-stack-row minute-stack-row">
                        <div class="stack-wheels-pair">
                            <div class="wheel-slot digit-slot" id="slot-m1" data-wheel="m1" tabindex="0" role="slider"
                                aria-label="Minute tens selector">
                                <div class="wheel-cylinder" id="cylinder-m1"></div>
                            </div>
                            <div class="wheel-slot digit-slot" id="slot-m2" data-wheel="m2" tabindex="0" role="slider"
                                aria-label="Minute units selector">
                                <div class="wheel-cylinder" id="cylinder-m2"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Date Complications Row: [AD/BC Switch] [Y1 Y2 Y3 Y4] [Month] [D1 D2] -->
            <div class="wheels-row date-deck" role="group" aria-label="Date complications selector">
                <!-- Era Switch (AD / BC) -->
                <div class="era-lever-module is-ad" id="module-era" tabindex="0" role="switch" aria-checked="true"
                    aria-label="Era selector switch (AD or BC)" title="Era switch: Click to toggle AD / BC">
                    <div class="era-switch-plate">
                        <div class="era-rocker is-ad" id="era-lever">
                            <div class="era-sector era-sector-ad active" id="label-ad" data-era="AD">
                                <span class="era-text">AD</span>
                            </div>
                            <div class="era-sector era-sector-bc" id="label-bc" data-era="BC">
                                <span class="era-text">BC</span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Year Digits (Y1-Y4) -->
                <div class="wheel-group year-group" id="group-year" role="group" aria-label="Year selector">
                    <div class="wheel-slot digit-slot year-digit-slot" id="slot-y1" data-wheel="y1" tabindex="0"
                        role="slider" aria-label="Year thousands">
                        <div class="wheel-cylinder" id="cylinder-y1"></div>
                    </div>
                    <div class="wheel-slot digit-slot year-digit-slot" id="slot-y2" data-wheel="y2" tabindex="0"
                        role="slider" aria-label="Year hundreds">
                        <div class="wheel-cylinder" id="cylinder-y2"></div>
                    </div>
                    <div class="wheel-slot digit-slot year-digit-slot" id="slot-y3" data-wheel="y3" tabindex="0"
                        role="slider" aria-label="Year tens">
                        <div class="wheel-cylinder" id="cylinder-y3"></div>
                    </div>
                    <div class="wheel-slot digit-slot year-digit-slot" id="slot-y4" data-wheel="y4" tabindex="0"
                        role="slider" aria-label="Year units">
                        <div class="wheel-cylinder" id="cylinder-y4"></div>
                    </div>
                </div>

                <!-- Month in Text Wheel -->
                <div class="wheel-slot month-slot" id="slot-month" data-wheel="month" tabindex="0" role="slider"
                    aria-label="Month selector">
                    <div class="wheel-cylinder" id="cylinder-month"></div>
                </div>

                <!-- Date Digits (D1-D2) -->
                <div class="wheel-group day-group" id="group-day" role="group" aria-label="Day of month selector">
                    <div class="wheel-slot digit-slot day-digit-slot" id="slot-d1" data-wheel="d1" tabindex="0"
                        role="slider" aria-label="Day tens">
                        <div class="wheel-cylinder" id="cylinder-d1"></div>
                    </div>
                    <div class="wheel-slot digit-slot day-digit-slot" id="slot-d2" data-wheel="d2" tabindex="0"
                        role="slider" aria-label="Day units">
                        <div class="wheel-cylinder" id="cylinder-d2"></div>
                    </div>
                </div>
            </div>

            <!-- Full Weekday Complication Pod -->
            <div class="weekday-full-pod" id="weekday-display" aria-label="Day of week"
                title="Weekday (Live calculated via Zeller's Congruence)">
                <span class="weekday-value" id="weekday-value">---</span>
            </div>
        </main>
    </div>
</body>

</html>
