<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="metalBezel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b8c0d4"/>
      <stop offset="35%" stop-color="#555d6e"/>
      <stop offset="70%" stop-color="#2a303c"/>
      <stop offset="100%" stop-color="#8e96aa"/>
    </linearGradient>
  </defs>
  <!-- Transparent Background - Outer Metallic Bezel with chamfered profile -->
  <rect x="5" y="5" width="90" height="90" rx="22" fill="none" stroke="url(#metalBezel)" stroke-width="4"/>
  <rect x="9" y="9" width="82" height="82" rx="18" fill="none" stroke="rgba(255, 24, 83, 0.4)" stroke-width="1.2"/>
  
  <!-- 4-LED Segmental Triangles (Top, Right, Bottom, Left) -->
  <!-- Top LED (active ruby glow) -->
  <polygon points="18,18 82,18 50,50" fill="#ff1853" filter="url(#neonGlow)"/>
  <!-- Right LED (off metallic steel facet) -->
  <polygon points="82,18 82,82 50,50" fill="rgba(140, 155, 180, 0.18)" stroke="#4a5264" stroke-width="2"/>
  <!-- Bottom LED (active ruby glow) -->
  <polygon points="82,82 18,82 50,50" fill="#ff1853" filter="url(#neonGlow)"/>
  <!-- Left LED (off metallic steel facet) -->
  <polygon points="18,82 18,18 50,50" fill="rgba(140, 155, 180, 0.18)" stroke="#4a5264" stroke-width="2"/>
  </svg>
